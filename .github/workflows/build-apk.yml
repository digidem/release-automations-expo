# Summary:
#
# Builds an Android APK from a release branch on EAS, without submitting anything to a store.
#
# Triggers:
#
# - Manually, from the Actions tab. Pick the release branch (e.g. `release/v4.x`) in the
#   "Use workflow from" dropdown.
#
# Effects:
#
# - Triggers a production APK build on EAS (the `production-apk` profile)
# - Waits for EAS build to complete, then attaches the APK to the GitHub Release for that version,
#   if one exists. Use this when the APK download failed during `release-android.yml`.
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check this is a release branch
        if: ${{ !startsWith(github.ref_name, 'release/') }}
        run: |
          echo "::error::Run this workflow from a release branch, not $GITHUB_REF_NAME"
          exit 1

      - name: Create GitHub App Token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build on EAS
        id: build
        env:
          EAS_PROJECT_URL: ${{ vars.EAS_PROJECT_URL }}
        run: |
          build_id=$( eas build --platform android --profile production-apk --json --non-interactive --no-wait | jq '.[0].id' --raw-output )
          if [ -z "$build_id" ]; then
            echo "Unable to get build ID"
            exit 1
          fi
          echo "Build ID: $build_id"
          echo "build_id=$build_id" >> $GITHUB_OUTPUT
          echo ":package: APK build: $EAS_PROJECT_URL/builds/$build_id" >> $GITHUB_STEP_SUMMARY

      - name: Wait for EAS build to finish
        env:
          BUILD_ID: ${{ steps.build.outputs.build_id }}
        run: |
          echo "Waiting for EAS build $BUILD_ID to complete..."
          while true; do
            status=$(eas build:view "$BUILD_ID" --json | jq -r '.status')
            echo "Build status: $status"
            if [ "$status" = "FINISHED" ]; then
              echo "Build finished successfully"
              break
            elif [ "$status" = "ERRORED" ] || [ "$status" = "CANCELED" ]; then
              echo "Build failed with status: $status"
              exit 1
            fi
            sleep 60
          done

      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BUILD_ID: ${{ steps.build.outputs.build_id }}
        run: |
          build=$(eas build:view "$BUILD_ID" --json)
          version=$(echo "$build" | jq -r '.appVersion')
          apk_url=$(echo "$build" | jq -r '.artifacts.buildUrl')
          if ! gh release view "v${version}" > /dev/null 2>&1; then
            echo "::notice::There is no GitHub Release v${version} yet, so the APK is only on EAS."
            exit 0
          fi
          curl -fL "$apk_url" -o "comapeo-v${version}.apk"
          gh release upload "v${version}" "comapeo-v${version}.apk#CoMapeo Android APK" --clobber
