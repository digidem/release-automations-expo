# Summary:
#
# Creates a production build of the Android app from a release branch and distributes it.
#
# Triggers:
#
# - Manually, from the Actions tab. Pick the release branch (e.g. `release/v4.x`) in the
#   "Use workflow from" dropdown.
#
# Effects:
#
# - Triggers a Release build on EAS
# - Creates a release tag named `v${version}` on the release branch, unless it already exists.
#   Release tags can't be moved, so re-releasing a version keeps the original tag.
# - Waits for EAS build to complete, then:
#   - Creates or updates the GitHub Release with the release notes and the APK downloaded from R2.
#     If the APK can't be downloaded, the release goes ahead without it and the run ends with a
#     red X. `build-apk.yml` can attach one afterwards.
#   - Submits the AAB to the Google Play Store production track via `eas submit`, if `submit` is checked
name: Release Android

on:
  workflow_dispatch:
    inputs:
      submit:
        description: 'Submit to the Google Play Store'
        required: true
        default: true
        type: boolean

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.build.outputs.build_id }}

    steps:
      - name: Check this is a release branch
        if: ${{ !startsWith(github.ref_name, 'release/') }}
        run: |
          echo "::error::Run this workflow from a release branch, not $GITHUB_REF_NAME"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build on EAS
        id: build
        env:
          EAS_PROJECT_URL: ${{ vars.EAS_PROJECT_URL }}
        run: |
          build_id=$( eas build --platform android --profile production --json --non-interactive --no-wait | jq '.[0].id' --raw-output )
          if [ -z "$build_id" ]; then
            echo "Unable to get build ID"
            exit 1
          fi
          echo "Build ID: $build_id"
          echo "build_id=$build_id" >> $GITHUB_OUTPUT
          echo ":rocket: Android release build: $EAS_PROJECT_URL/builds/$build_id" >> $GITHUB_STEP_SUMMARY

  tag:
    name: Create release tag
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - run: npm install --no-save semver
        shell: bash

      - name: Extract release versions
        id: version
        run: |
          release_version_short=$(node -e "const {version} = require('./package.json'); const semver = require('semver'); const parsed = semver.parse(version); console.log(parsed.minor + '.' + parsed.patch);")
          echo "release_version_short=$release_version_short" >> $GITHUB_OUTPUT

      - name: Tag release
        env:
          TAG: v${{ steps.version.outputs.release_version_short }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::notice::$TAG already exists, so this is a re-release. Leaving the tag where it is."
            exit 0
          fi
          git config --global user.name 'awana-release-bot[bot]'
          git config --global user.email '${{ vars.RELEASE_BOT_USER_ID }}+awana-release-bot[bot]@users.noreply.github.com'
          git tag "$TAG"
          git push origin "$TAG"

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, tag]
    timeout-minutes: 60

    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Wait for EAS build to finish
        env:
          BUILD_ID: ${{ needs.build.outputs.build_id }}
        run: |
          echo "Waiting for EAS build $BUILD_ID to complete..."
          while true; do
            status=$(eas build:view "$BUILD_ID" --json | jq -r '.status')
            echo "Build status: $status"
            if [ "$status" = "FINISHED" ]; then
              echo "Build finished successfully"
              break
            elif [ "$status" = "ERRORED" ] || [ "$status" = "CANCELED" ]; then
              echo "Build failed with status: $status"
              exit 1
            fi
            sleep 60
          done

      - name: Extract version from EAS build
        id: eas_version
        env:
          BUILD_ID: ${{ needs.build.outputs.build_id }}
        run: |
          version=$(eas build:view "$BUILD_ID" --json | jq -r '.appVersion')
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Download APK from R2
        id: apk
        continue-on-error: true
        env:
          VERSION: ${{ steps.eas_version.outputs.version }}
        run: |
          APK_URL="https://downloads.comapeo.app/android/release/comapeo-v${VERSION}.apk"
          echo "Downloading APK from $APK_URL"
          if ! curl -fL "$APK_URL" -o "comapeo-v${VERSION}.apk"; then
            echo "::error::Could not download the APK from $APK_URL. The GitHub Release will be created without it. Run the Build APK workflow to attach one."
            echo ":warning: The APK could not be downloaded, so the GitHub Release has no APK. Run the Build APK workflow to attach one." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Read release notes
        id: release_notes
        env:
          VERSION: ${{ steps.eas_version.outputs.version }}
        run: |
          MINOR_VERSION=$(echo "$VERSION" | cut -d. -f1)
          NOTES_FILE="release-notes/closed-prs-v${MINOR_VERSION}.md"
          if [ -f "$NOTES_FILE" ]; then
            {
              echo "body<<RELEASE_NOTES_EOF"
              cat "$NOTES_FILE"
              echo "RELEASE_NOTES_EOF"
            } >> $GITHUB_OUTPUT
          else
            echo "body=No release notes found." >> $GITHUB_OUTPUT
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.eas_version.outputs.version }}
          RELEASE_BODY: ${{ steps.release_notes.outputs.body }}
          APK_DOWNLOADED: ${{ steps.apk.outcome == 'success' }}
        run: |
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            gh release edit "v${VERSION}" --notes "$RELEASE_BODY"
          else
            gh release create "v${VERSION}" \
              --title "CoMapeo v${VERSION}" \
              --notes "$RELEASE_BODY"
          fi
          if [ "$APK_DOWNLOADED" = "true" ]; then
            gh release upload "v${VERSION}" "comapeo-v${VERSION}.apk#CoMapeo Android APK" --clobber
          fi

      # Fails the run (red X, and GitHub's failed-workflow email) only after the release is created.
      # Play Store submission is a separate job, so it is not affected.
      - name: Report missing APK
        if: steps.apk.outcome == 'failure'
        run: |
          echo "::error::The GitHub Release has no APK. Run the Build APK workflow to attach one."
          exit 1

  submit:
    name: Submit to Play Store
    runs-on: ubuntu-latest
    if: inputs.submit
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Submit to Google Play Store
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APP_VARIANT: production
        run: |
          eas submit --platform android --profile production --id ${{ needs.build.outputs.build_id }} --non-interactive
